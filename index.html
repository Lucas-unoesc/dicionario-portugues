<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dicionário Português</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-light" style="padding-top: 85px;">

  <!-- Cabeçalho Fixo -->
  <header class="bg-primary text-white fixed-top py-3 shadow-sm">
    <div class="container d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <i class="fa-solid fa-book-bookmark fs-3"></i>
        <h1 class="h4 m-0 fw-bold">Dicionário Português</h1>
      </div>
      <span class="badge bg-white text-primary rounded-pill px-3 py-2">Trabalho Acadêmico</span>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container my-4" style="max-width: 720px;">
    
    <!-- Seção do Campo de Busca -->
    <section class="card border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
      <form id="searchForm">
        <label for="searchInput" class="form-label text-muted small fw-bold text-uppercase mb-2">
          Buscar palavra
        </label>
        <div class="input-group input-group-lg">
          <span class="input-group-text bg-light border-end-0 text-muted">
            <i class="fa-solid fa-magnifying-glass"></i>
          </span>
          <input 
            type="text" 
            id="searchInput" 
            class="form-control bg-light border-start-0 ps-0 fs-6" 
            placeholder="Digite: resiliencia, amor, computador, efemero..."
            autocomplete="off"
            required
          >
          <button class="btn btn-primary px-4 fw-semibold fs-6" type="submit" id="btnSearch">
            Buscar
          </button>
        </div>
      </form>
    </section>

    <!-- Card de Resultado -->
    <section id="resultCard" class="card border-0 shadow-sm rounded-4 p-4 bg-white">
      
      <!-- Cabeçalho da Palavra -->
      <div class="d-flex justify-content-between align-items-start border-bottom pb-3 mb-3">
        <div>
          <span id="wordClass" class="badge bg-primary-subtle text-primary fw-semibold mb-2">Substantivo Feminino</span>
          <h2 id="wordTitle" class="display-6 fw-bold text-dark m-0">Resiliência</h2>
          <p id="wordPhonetic" class="text-muted mb-0 mt-1 fs-6">/re.zi.li.'ẽ.sjɐ/</p>
        </div>
      </div>

      <!-- Significado -->
      <div class="mb-4">
        <h3 class="h6 text-uppercase text-muted fw-bold mb-2">
          <i class="fa-solid fa-quote-left text-primary me-2"></i>Significado
        </h3>
        <p id="wordMeaning" class="text-secondary leading-relaxed fs-6 m-0">
          Capacidade de se recuperar facilmente ou se adaptar às mudanças e intempéries.
        </p>
      </div>

      <!-- Sinônimos e Antônimos -->
      <div class="row g-3 pt-2 border-top">
        <div class="col-md-6">
          <h4 class="h6 text-success fw-bold mb-2">
            <i class="fa-solid fa-equals me-2"></i>Sinônimos
          </h4>
          <div id="synonymsList" class="d-flex flex-wrap gap-1">
            <span class="badge bg-success-subtle text-success border border-success-subtle">flexibilidade</span>
            <span class="badge bg-success-subtle text-success border border-success-subtle">resistência</span>
          </div>
        </div>

        <div class="col-md-6">
          <h4 class="h6 text-danger fw-bold mb-2">
            <i class="fa-solid fa-not-equal me-2"></i>Antônimos
          </h4>
          <div id="antonymsList" class="d-flex flex-wrap gap-1">
            <span class="badge bg-danger-subtle text-danger border border-danger-subtle">rigidez</span>
            <span class="badge bg-danger-subtle text-danger border border-danger-subtle">fragilidade</span>
          </div>
        </div>
      </div>

    </section>

  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- Lógica JavaScript Local (Perfeita para trabalhos acadêmicos) -->
  <script>
    // Nosso "banco de dados" interno de palavras
    const dicionario = {
      "resiliencia": {
        classe: "Substantivo Feminino",
        fonetica: "/re.zi.li.'ẽ.sjɐ/",
        significado: "Capacidade de se recuperar facilmente ou se adaptar às mudanças e intempéries.",
        sinonimos: ["flexibilidade", "resistência", "adaptação"],
        antonimos: ["rigidez", "fragilidade"]
      },
      "amor": {
        classe: "Substantivo Masculino",
        fonetica: "/a.'moʁ/",
        significado: "Forte afeição por outra pessoa, fundada em laços de afeto ou parentesco.",
        sinonimos: ["afeto", "carinho", "paixão", "amor", "ternura"],
        antonimos: ["ódio", "aversão", "rancor"]
      },
      "computador": {
        classe: "Substantivo Masculino",
        fonetica: "/kõ.pu.ta.'doʁ/",
        significado: "Máquina eletrônica capaz de processar dados e executar instruções programadas.",
        sinonimos: ["máquina", "processador", "pc"],
        antonimos: []
      },
      "efemero": {
        classe: "Adjetivo",
        fonetica: "/e.'fɛ.me.ɾu/",
        significado: "Que dura apenas um dia; que é passageiro, breve, fugaz.",
        sinonimos: ["passageiro", "fugaz", "breve", "momentâneo"],
        antonimos: ["eterno", "duradouro", "permanente"]
      }
    };

    const formulario = document.getElementById("searchForm");
    const inputBusca = document.getElementById("searchInput");
    const wordTitle = document.getElementById("wordTitle");
    const wordClass = document.getElementById("wordClass");
    const wordPhonetic = document.getElementById("wordPhonetic");
    const wordMeaning = document.getElementById("wordMeaning");
    const synonymsList = document.getElementById("synonymsList");
    const antonymsList = document.getElementById("antonymsList");

    formulario.addEventListener("submit", function(evento) {
      evento.preventDefault();

      // Normaliza o texto digitado (remove acentos e deixa minúsculo para facilitar a busca)
      let termo = inputBusca.value.trim().toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

      if (dicionario[termo]) {
        const dados = dicionario[termo];
        
        wordTitle.textContent = inputBusca.value.trim();
        wordClass.textContent = dados.classe;
        wordPhonetic.textContent = dados.fonetica;
        wordMeaning.textContent = dados.significado;

        // Preenche sinônimos dinamicamente
        synonymsList.innerHTML = "";
        if (dados.sinonimos.length > 0) {
          dados.sinonimos.forEach(sin => {
            synonymsList.innerHTML += `<span class="badge bg-success-subtle text-success border border-success-subtle">${sin}</span> `;
          });
        } else {
          synonymsList.innerHTML = "<span class='text-muted small'>Nenhum sinônimo cadastrado</span>";
        }

        // Preenche antônimos dinamicamente
        antonymsList.innerHTML = "";
        if (dados.antonimos.length > 0) {
          dados.antonimos.forEach(ant => {
            antonymsList.innerHTML += `<span class="badge bg-danger-subtle text-danger border border-danger-subtle">${ant}</span> `;
          });
        } else {
          antonymsList.innerHTML = "<span class='text-muted small'>Nenhum antônimo cadastrado</span>";
        }

      } else {
        wordTitle.textContent = "Não encontrado";
        wordClass.textContent = "Erro";
        wordPhonetic.textContent = "";
        wordMeaning.textContent = `A palavra "${inputBusca.value}" não foi encontrada no banco de dados do projeto. Tente: resiliencia, amor, computador ou efemero.`;
        synonymsList.innerHTML = "";
        antonymsList.innerHTML = "";
      }

      inputBusca.value = "";
    });
  </script>
</body>
</html>
